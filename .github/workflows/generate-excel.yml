name: AI Excel Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "描述你想要的Excel表格（例如：做一个员工薪资表，包含姓名、部门、职位、基本工资、奖金、社保，10行示例数据，最后一行用SUM公式合计）"
        required: true
        type: string
      filename:
        description: "输出文件名（不含扩展名）"
        required: false
        default: "output"
        type: string

permissions:
  contents: read
  models: write

jobs:
  generate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Step 1 - AI 解析需求，生成 Excel 指令
        id: ai_parse
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          system-prompt: |
            你是一个 Excel 生成专家。根据用户的自然语言需求，输出一段 JSON 数组，描述如何用 OfficeCLI 命令创建 Excel 文件。

            OfficeCLI 支持的命令格式：
            - 创建文件: officecli create <filename>.xlsx
            - 添加工作表: officecli add <file> / --type sheet --prop name="Sheet名"
            - 写入单元格: officecli set <file> '/Sheet1/A1' --prop value="内容"
            - 设置公式: officecli set <file> '/Sheet1/B10' --prop formula="=SUM(B2:B9)"
            - 设置表头样式（加粗）: officecli set <file> '/Sheet1/A1:F1' --prop bold=true --prop bgColor="4472C4" --prop color="FFFFFF"
            - 导入CSV: officecli import <file> '/Sheet名' data.csv --header

            输出要求：
            1. 只输出一个 JSON 数组，每个元素是一条 shell 命令字符串
            2. 第一条命令必须是 create 创建文件
            3. 合理设计表头、数据、公式、格式
            4. 金额类数据右对齐，表头加粗带背景色
            5. 最后一行如果是合计，必须用公式
            6. 文件名统一用 output.xlsx

            示例输出：
            [
              "officecli create output.xlsx",
              "officecli set output.xlsx '/Sheet1/A1' --prop value=\"姓名\"",
              "officecli set output.xlsx '/Sheet1/B1' --prop value=\"部门\"",
              "officecli set output.xlsx '/Sheet1/A1:E1' --prop bold=true --prop bgColor=\"4472C4\" --prop color=\"FFFFFF\"",
              "officecli set output.xlsx '/Sheet1/A2' --prop value=\"张三\"",
              "officecli set output.xlsx '/Sheet1/B2' --prop value=\"技术部\"",
              "officecli set output.xlsx '/Sheet1/E11' --prop formula=\"=SUM(E2:E10)\""
            ]

          prompt: |
            用户需求：${{ github.event.inputs.prompt }}

            请输出 JSON 数组格式的 OfficeCLI 命令列表。

      - name: Step 2 - 安装 OfficeCLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/iOfficeAI/OfficeCLI/main/install.sh | bash
          echo "$HOME/.officecli/bin" >> $GITHUB_PATH

      - name: Step 3 - 生成 Excel 文件
        run: |
          echo "AI 生成的指令："
          echo '${{ steps.ai_parse.outputs.response }}'

          # 提取 JSON 并逐条执行
          echo '${{ steps.ai_parse.outputs.response }}' | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for cmd in data:
              print(cmd)
          " > commands.sh

          cat commands.sh

          # 逐条执行命令
          while IFS= read -r cmd; do
            echo ">>> 执行: $cmd"
            eval "$cmd"
          done < commands.sh

      - name: Step 4 - 验证生成的文件
        run: |
          ls -la output.xlsx
          officecli view output.xlsx outline || true

      - name: Step 5 - 上传 Excel 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.filename || 'output' }}-excel
          path: output.xlsx
          retention-days: 30
